<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Actas de víveres PAE</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script src="data.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap">
<style>
:root{--ink:#1d2a31;--muted:#5d6b73;--line:#d9e0e3;--bg:#f3f5f4;--green:#1c6b4b;--green-d:#134e36;--amber:#f2b705;--amber-bg:#fff6d6}
*{box-sizing:border-box}
body{font:15px/1.45 'Public Sans',system-ui,Arial,sans-serif;margin:0;background:var(--bg);color:var(--ink)}
.top{display:flex;align-items:center;gap:28px;flex-wrap:wrap;background:#fff;padding:14px 28px 16px;border-bottom:1px solid var(--line);position:relative}
.top::after{content:"";position:absolute;left:0;right:0;bottom:-1px;height:4px;background:linear-gradient(90deg,#f2b705 0 50%,#1f4e9c 50% 75%,#c8202f 75%)}
.logos{display:flex;align-items:center;gap:18px}.logos img{height:40px;width:auto}
.top h1{margin:0;font-size:20px;font-weight:700;letter-spacing:-.01em}.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.wrap{display:grid;grid-template-columns:230px minmax(0,1fr);gap:28px;max-width:1280px;margin:0 auto;padding:26px 28px}
nav{display:flex;flex-direction:column;gap:2px;align-self:start;position:sticky;top:16px}
nav h4{margin:16px 12px 6px;font-size:12.5px;font-weight:600;color:var(--muted)}nav h4:first-child{margin-top:0}
nav button{text-align:left;border:0;border-left:3px solid transparent;background:none;padding:9px 12px;border-radius:6px;font:inherit;color:var(--ink);cursor:pointer}
nav button:hover{background:#e6ebe8}nav button.on{background:#fff;border-left-color:var(--green);font-weight:600;box-shadow:0 0 0 1px var(--line)}nav button.adv.on{border-left-color:var(--amber)}
.ph h2{margin:0;font-size:24px;letter-spacing:-.015em}.ph p{margin:4px 0 16px;color:var(--muted);max-width:70ch}
.ph.adv p{background:var(--amber-bg);border-left:4px solid var(--amber);padding:8px 12px;color:var(--ink);border-radius:4px}
section{display:none;background:#fff;border:1px solid var(--line);border-radius:8px;padding:22px;overflow-x:auto}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
label{display:flex;flex-direction:column;font-size:13px;font-weight:500;color:var(--muted);gap:5px}
input,select{padding:8px 10px;border:1px solid #b9c4c9;border-radius:6px;font:inherit;color:var(--ink);background:#fff;width:100%}
input:focus-visible,select:focus-visible,button:focus-visible{outline:3px solid #8fc9ad;outline-offset:1px}
h3{font-size:16px;margin:28px 0 4px}select{width:auto;min-width:280px}
table{border-collapse:collapse;width:100%}th{position:sticky;top:0;background:#eef2f0;text-align:left;font-size:12.5px;font-weight:600;padding:9px 8px;border-bottom:1px solid var(--line)}
td{border-bottom:1px solid #edf1f2;padding:2px 4px;font-size:13px}td input{border:1px solid transparent;border-radius:4px;padding:6px;min-width:70px}td input:hover{border-color:var(--line)}td:first-child input{min-width:230px}tr:hover td{background:#f8faf9}
#dias{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;margin-top:10px}
label.chip{flex-direction:row;align-items:center;gap:8px;border:1px solid var(--line);border-radius:6px;padding:10px;font-size:13px;font-weight:400;color:var(--ink);cursor:pointer;background:#fafbfa}
label.chip:has(input:checked){background:#e7f3ed;border-color:var(--green)}label.chip input{width:auto}
#cnt{font-weight:600;margin-top:12px}
.p{background:var(--green);color:#fff;border:0;border-radius:6px;padding:11px 18px;margin:4px 8px 4px 0;font:inherit;font-weight:600;cursor:pointer}.p:hover{background:var(--green-d)}
.s{background:#fff;border:1px solid #b9c4c9;border-radius:6px;padding:8px 14px;margin:8px 8px 0 0;font:inherit;cursor:pointer}.s:hover{background:#f1f5f3}
b.x{color:#b3261e;cursor:pointer;padding:4px 9px;border-radius:4px}b.x:hover{background:#fdecea}
.n{color:var(--muted);font-size:13px;max-width:75ch}hr{border:0;border-top:1px solid var(--line);margin:26px 0 8px}
.stats{display:flex;gap:12px;margin-bottom:18px;flex-wrap:wrap}.stats div{flex:1;min-width:150px;border:1px solid var(--line);border-radius:6px;padding:10px 14px;color:var(--muted);font-size:13px}.stats b{display:block;font-size:26px;color:var(--ink);font-weight:700}
#gr td input{width:48px;min-width:0;text-align:right}#gr td:first-child{position:sticky;left:0;background:#fff;white-space:nowrap}
@media(max-width:820px){.wrap{grid-template-columns:1fr;padding:16px}nav{flex-direction:row;overflow-x:auto;position:static}nav h4{display:none}nav button{white-space:nowrap;border-left:0;border-bottom:3px solid transparent}nav button.on{border-bottom-color:var(--green)}#dias{grid-template-columns:repeat(2,1fr)}.top{padding:12px 16px 16px}}
.top>*:not(.lines){position:relative;z-index:1}
.lines{position:absolute;right:0;top:0;width:62%;height:100%;pointer-events:none;opacity:.55;transform:translate(calc(var(--px,0)*-30px),calc(var(--py,0)*8px));transition:transform .4s ease-out}
.lines path{fill:none;stroke-width:2;vector-effect:non-scaling-stroke;stroke-dasharray:14 10;animation:flow 6s linear infinite}
.lines path:nth-child(even){animation-direction:reverse;animation-duration:9s}@keyframes flow{to{stroke-dashoffset:-96}}
@media(prefers-reduced-motion:reduce){.lines path{animation:none}}@media(max-width:820px){.lines{width:100%;opacity:.3}}
label.chip span{display:flex;flex-direction:column;line-height:1.3}label.chip small{color:var(--muted);font-size:12px}
dialog{border:0;border-radius:10px;padding:24px;max-width:430px;box-shadow:0 12px 40px rgba(0,0,0,.28);color:var(--ink);font-family:inherit}dialog::backdrop{background:rgba(20,30,35,.5)}
dialog h3{margin:0 0 8px}.dact{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.dact .s{margin:0}.dact .p{margin:0}
.p.danger{background:#b3261e}.p.danger:hover{background:#8f1d17}.s.dng{color:#b3261e;border-color:#e3b5b1}.s.dng:hover{background:#fdecea}
label.s{flex-direction:row;display:inline-flex;align-items:center;font-size:15px;font-weight:400;color:var(--ink);gap:0}
.card{border:1px solid var(--line);border-radius:8px;padding:16px 18px;background:#fafbfa;margin-top:30px}.card h3{margin:0 0 4px}.acts{display:flex;gap:8px;flex-wrap:wrap}.acts .s{margin:8px 0 0}
.empty{padding:40px 16px;text-align:center;color:var(--muted)}.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.hcard{border:1px solid var(--line);border-radius:8px;padding:16px 18px;margin:16px 0}.hh{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:12px}.hh label{min-width:260px}
.bar{display:grid;grid-template-columns:minmax(110px,200px) 1fr 76px;gap:10px;align-items:center;font-size:12.5px;margin:5px 0}.bar span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.bar>div{background:#eef2f0;border-radius:3px}.bar i{display:block;height:12px;border-radius:3px}.bar b{text-align:right}
.lk{background:none;border:0;color:var(--green);cursor:pointer;font:inherit;font-size:13px;text-decoration:underline;padding:2px 8px}.wk{margin:16px 0}.wh{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:8px}.wh .n{margin-right:auto}.wd{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}#dias{display:block;margin-top:6px}@media(max-width:820px){.wd{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<header class=top><div class=logos id=logos></div><div><h1>Actas de entrega de víveres</h1><p>Programa de Alimentación Escolar</p></div><svg class=lines viewBox="0 0 600 80" preserveAspectRatio="none" aria-hidden="true"><path d="M0 30 C100 -5 200 65 300 30 S500 -5 600 30" stroke="#1c6b4b"/><path d="M0 40 C100 5 200 75 300 40 S500 5 600 40" stroke="#f2b705"/><path d="M0 50 C100 15 200 85 300 50 S500 15 600 50" stroke="#1f4e9c"/><path d="M0 60 C100 25 200 95 300 60 S500 25 600 60" stroke="#c8202f"/></svg></header>
<div class=wrap><nav id=nav></nav>
<main><div class=ph id=ph><h2 id=pt></h2><p id=pd></p></div>
<section id="t-ent"></section><section id="t-sed"></section><section id="t-pro"></section><section id="t-gr"></section>
<section id="t-gen"></section><section id="t-his"></section>
</main></div>
<dialog id=dlg><h3 id=dt></h3><p id=dm class=n></p><div class=dact><button class=s id=dcancel onclick="$('dlg').close()">Cancelar</button><button class="p danger" id=dok></button></div></dialog>
<script>
const $=id=>document.getElementById(id);
const mig=o=>{if(o.menus){o.sel=Array(20).fill(false);o.menus.forEach(x=>{if(x.on)o.sel[x.m-1]=true});delete o.menus}return o};
let S=mig(JSON.parse(localStorage.getItem('pae2')||'null')||JSON.parse(JSON.stringify(DEF)));
let H=JSON.parse(localStorage.getItem('pae_h')||'[]');const saveH=()=>{try{localStorage.setItem('pae_h',JSON.stringify(H))}catch(e){}};
const save=()=>{try{localStorage.setItem('pae2',JSON.stringify(S))}catch(e){}};
function set(p,v,num){const k=p.split('.');let o=S;for(let i=0;i<k.length-1;i++)o=o[k[i]];o[k[k.length-1]]=num?(parseFloat(v)||0):v;save()}
const esc=s=>String(s==null?'':s).replace(/"/g,'&quot;').replace(/</g,'&lt;');
const inp=(p,v,t)=>`<input type="${t||'text'}" ${t=='number'?'step="any"':''} value="${esc(v)}" oninput="set('${p}',this.value,${t=='number'})">`;
const fd=s=>s?s.split('-').reverse().join('/'):'';
/* ---- cálculo ---- */
const gpc=p=>S.sel.reduce((a,v,i)=>a+(v?(+p.g[i]||0):0),0);
const raw=(p,s)=>gpc(p)*s.c/(p.e||1);
const qty=(p,s)=>Math.ceil(raw(p,s)-1e-9);
const act=()=>S.sedes.filter(s=>s.c>0);
const fq=(p,q)=>p.e==1?(q/1000).toFixed(2)+' kg':String(q);
const ndias=()=>S.sel.filter(Boolean).length;
function provider(){const C=S.prods.filter(p=>p.d),A=act();return{C,rows:A.map(s=>[s.n,s.c,...C.map(p=>qty(p,s))]),tot:C.map(p=>A.reduce((a,s)=>a+qty(p,s),0)),cup:A.reduce((a,s)=>a+s.c,0)}}
/* ---- pantallas ---- */
const F=[['num','N° de entrega','number'],['oper','Operador / proveedor'],['mun','Municipio'],['sub','Subregión'],['lugar','Lugar de entrega'],['hora','Hora de entrega','time'],['veh','Vehículo / Marca'],['placa','Placa'],['fecha','Fecha de entrega','date'],['desde','Consumo desde','date'],['hasta','Consumo hasta','date'],['cod','Código (encabezado del acta)'],['ver','Versión (encabezado)'],['fdoc','Fecha (encabezado)']];
/*D*/const pd=s=>new Date(s+'T12:00:00'),ds=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
function festivos(y){const L=[],mon=t=>{const w=t.getDay();if(w!=1)t.setDate(t.getDate()+(8-w)%7)};const add=(m,d,n,mv)=>{const t=new Date(y,m-1,d,12);if(mv)mon(t);L.push([ds(t),n])};
const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3),h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451),mo=Math.floor((h+l-7*m+114)/31),da=(h+l-7*m+114)%31+1;
const E=(n,nm,mv)=>{const t=new Date(y,mo-1,da+n,12);if(mv)mon(t);L.push([ds(t),nm])};
add(1,1,'Año Nuevo');add(1,6,'Reyes Magos',1);add(3,19,'San José',1);E(-3,'Jueves Santo');E(-2,'Viernes Santo');add(5,1,'Día del Trabajo');E(39,'Ascensión del Señor',1);E(60,'Corpus Christi',1);E(68,'Sagrado Corazón',1);add(6,29,'San Pedro y San Pablo',1);add(7,20,'Día de la Independencia');add(8,7,'Batalla de Boyacá');add(8,15,'Asunción de la Virgen',1);add(10,12,'Día de la Raza',1);add(11,1,'Todos los Santos',1);add(11,11,'Independencia de Cartagena',1);add(12,8,'Inmaculada Concepción');add(12,25,'Navidad');return L.sort((p,q)=>p[0]<q[0]?-1:1)}
const FS={},fsy=y=>FS[y]||(FS[y]=new Set(festivos(y).map(x=>x[0]))),isBD=d=>d.getDay()%6!=0&&!fsy(d.getFullYear()).has(ds(d));
const nextBD=s=>{const d=pd(s);while(!isBD(d))d.setDate(d.getDate()+1);return ds(d)};
const addBD=(s,n)=>{const d=pd(nextBD(s));while(n>0){d.setDate(d.getDate()+1);if(isBD(d))n--}return ds(d)};
const plus1=s=>{const d=pd(s);d.setDate(d.getDate()+1);return ds(d)};/*/D*/
function calc(){const E=S.ent,f=$('f-desde'),m=E.fecha?plus1(E.fecha):'';if(m&&(!E.desde||E.desde<m))E.desde=m;if(E.desde){E.desde=nextBD(E.desde);if(!E.hastaMan||!E.hasta||E.hasta<E.desde)E.hasta=addBD(E.desde,Math.max(ndias()-1,0))}save();if(f){f.min=m;f.value=E.desde||''}const g=$('f-hasta');if(g){g.min=E.desde||'';g.value=E.hasta||''}fest()}
function fest(){const E=S.ent,el=$('dnote');if(!el)return;if(!E.desde){el.innerHTML='';return}const sug=addBD(E.desde,Math.max(ndias()-1,0)),end=E.hasta||sug,hs=[];for(let y=+E.desde.slice(0,4);y<=+end.slice(0,4);y++)festivos(y).forEach(([d,n])=>{if(d>=E.desde&&d<=end)hs.push(fd(d)+' '+n)});
el.innerHTML=(hs.length?'Festivos en este periodo (no se cuentan): '+hs.join('; ')+'. ':'No hay festivos en este periodo. ')+(E.hasta!=sug?`Con ${ndias()} días la fecha sugerida es ${fd(sug)}. <button class=lk onclick="S.ent.hastaMan=false;calc()">Usar la sugerida</button>`:'')}
function chgHasta(v){const E=S.ent;if(!v||v<E.desde){info('Fecha no válida','La fecha final no puede ser anterior al inicio del consumo ('+fd(E.desde)+').');$('f-hasta').value=E.hasta;return}E.hasta=v;E.hastaMan=true;save();fest()}
function chgFecha(v){S.ent.fecha=v;const o=S.ent.desde;calc();if(o&&S.ent.desde!=o)info('Fecha de consumo ajustada','La fecha de consumo debe ser posterior a la entrega, por eso pasó al '+fd(S.ent.desde)+'.')}
function chgDesde(v){if(S.ent.fecha&&v<=S.ent.fecha){info('Fecha no permitida','La fecha de consumo debe ser posterior a la fecha de entrega ('+fd(S.ent.fecha)+').');$('f-desde').value=S.ent.desde;return}S.ent.desde=v;S.ent.hastaMan=false;calc()}
function ask(t,m,fn,btn,solo){$('dt').textContent=t;$('dm').textContent=m;$('dok').textContent=btn||'Eliminar';$('dok').className=solo?'p':'p danger';$('dcancel').style.display=solo?'none':'';$('dok').onclick=()=>{$('dlg').close();fn()};$('dlg').showModal()}
const info=(t,m)=>ask(t,m,()=>{},'Entendido',1);
const fld=([k,l,t])=>k=='fecha'?`<label>${l}<input type=date id=f-fecha value="${S.ent.fecha||''}" onchange="chgFecha(this.value)"></label>`:k=='desde'?`<label>${l}<input type=date id=f-desde value="${S.ent.desde||''}" onchange="chgDesde(this.value)"></label>`:k=='hasta'?`<label>${l} (ajustable)<input type=date id=f-hasta value="${S.ent.hasta||''}" onchange="chgHasta(this.value)"></label>`:`<label>${l}${inp('ent.'+k,S.ent[k],t)}</label>`;
function rEnt(){const o=(v,t)=>`<option value=${v} ${S.ent.sem==v?'selected':''}>${t}</option>`;$('t-ent').innerHTML='<div class=g>'+F.map(fld).join('')+'</div><p class=n style="margin-top:12px">La fecha de consumo debe ser posterior a la fecha de entrega. La fecha final se sugiere sola con los días marcados (lunes a viernes, sin festivos de Colombia), pero puedes cambiarla.</p><p id=dnote class=n></p><h3>Semanas de esta entrega</h3><select onchange="setSem(this.value)" style="padding:6px">'+o(1,'Semanas 1 y 2 (menús 1 al 10)')+o(3,'Semanas 3 y 4 (menús 11 al 20)')+'</select><h3>Días de entrega</h3><p class=n>Por defecto se marcan las dos semanas elegidas (10 días). Desmarca los días sin clase y, si hace falta, marca días o semanas completas de otro ciclo. Cada día usa su menú: semana 1 = menús 1 al 5, semana 2 = 6 al 10, semana 3 = 11 al 15 y semana 4 = 16 al 20.</p><div id=dias></div><p id=cnt></p>';rDias()}
function setSem(v){S.ent.sem=+v;const b=+v==3?[2,3]:[0,1];S.sel=S.sel.map((_,i)=>b.includes(Math.floor(i/5)));save();rDias()}
function selW(w,v){for(let j=0;j<5;j++)S.sel[w*5+j]=v;save();rDias()}
function rDias(){const b=S.ent.sem==3?[2,3]:[0,1];$('dias').innerHTML=[0,1,2,3].map(w=>`<div class=wk><div class=wh><b>Semana ${w+1}</b><span class=n>${b.includes(w)?'Incluida en esta entrega':'Otra semana (opcional)'}</span><span><button class=lk onclick="selW(${w},true)">Marcar todos</button><button class=lk onclick="selW(${w},false)">Quitar todos</button></span></div><div class=wd>`+[0,1,2,3,4].map(j=>{const i=w*5+j;return `<label class=chip><input type=checkbox ${S.sel[i]?'checked':''} onchange="S.sel[${i}]=this.checked;save();cnt()"><span><b>Día ${j+1}</b><small>Menú ${i+1}</small></span></label>`}).join('')+'</div></div>').join('');cnt()}
const cnt=()=>{$('cnt').textContent='Días a entregar: '+ndias();calc()};
function del(a,i){const x=S[a][i],sede=a=='sedes';ask(sede?'¿Eliminar esta sede?':'¿Eliminar este producto?',`Se eliminará "${x.n||'sin nombre'}". ${sede?'Ya no se generará su acta ni aparecerá en la lista del proveedor.':'Dejará de aparecer en todas las actas y en el cálculo.'} Esta acción no se puede deshacer, salvo restaurando los datos originales.`,()=>{S[a].splice(i,1);save();rSedes();rProds();rGr()})}
function rSedes(){$('t-sed').innerHTML='<table><tr><th>Sede educativa<th>Código DANE<th>Cupos<th></tr>'+S.sedes.map((s,i)=>`<tr><td>${inp(`sedes.${i}.n`,s.n)}<td>${inp(`sedes.${i}.dane`,s.dane)}<td>${inp(`sedes.${i}.c`,s.c,'number')}<td><b class=x title="Eliminar" onclick="del('sedes',${i})">×</b>`).join('')+'</table><button class=s onclick="S.sedes.push({n:\'\',c:0,dane:\'\'});save();rSedes()">+ Agregar sede</button><p class=n>Las sedes con 0 cupos no generan acta.</p>'}
function rProds(){$('t-pro').innerHTML='<p class=n>Unidad: texto que sale en el acta (ej. Bolsa/500gr). Gramos por empaque: lo que pesa cada unidad (1 si se entrega a granel en gramos). ★ En la lista del proveedor: los productos marcados salen en la hoja resumen que se entrega al proveedor, con la cantidad por sede y el total (por defecto: frijol, carne de res, carne de cerdo y huevo).</p><table><tr><th>Producto<th>Unidad / empaque<th>Gramos por empaque<th title="Los productos marcados salen en la lista que se entrega al proveedor">★ En la lista del proveedor<th></tr>'+S.prods.map((p,i)=>`<tr><td>${inp(`prods.${i}.n`,p.n)}<td>${inp(`prods.${i}.u`,p.u)}<td>${inp(`prods.${i}.e`,p.e,'number')}<td style="text-align:center"><input type=checkbox style="width:auto" ${p.d?'checked':''} onchange="set('prods.${i}.d',this.checked)"><td><b class=x title="Eliminar" onclick="del('prods',${i})">×</b>`).join('')+'</table><button class=s onclick="S.prods.push({n:\'NUEVO PRODUCTO\',u:\'gr\',e:1,g:Array(20).fill(0),d:false});save();rProds();rGr()">+ Agregar producto</button>'}
function rGr(){$('t-gr').innerHTML='<p class=n>Gramos (o unidades) por cupo para cada menú.</p><table id=gr><tr><th>Producto'+Array.from({length:20},(_,j)=>`<th>M${j+1}`).join('')+'</tr>'+S.prods.map((p,i)=>`<tr><td>${esc(p.n)}`+Array.from({length:20},(_,j)=>`<td><input type=number step=any value="${p.g[j]||0}" oninput="set('prods.${i}.g.${j}',this.value,1)">`).join('')).join('')+'</table>'}
function rGen(){const P=provider();$('t-gen').innerHTML=`<div class=stats><div><b>${act().length}</b>sedes con cupos</div><div><b>${P.cup}</b>cupos en total</div><div><b>${ndias()}</b>días de entrega</div></div>
<button class=p onclick="pdfAll()">Descargar PDF con todas las actas</button><button class=p onclick="zipAll()">Descargar ZIP (un PDF por sede)</button><button class=p onclick="pv()">Lista del proveedor (PDF)</button> <span id=msg class=n></span>
